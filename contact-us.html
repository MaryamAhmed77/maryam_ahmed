<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>contact-us</title>
    <link rel="stylesheet" href="contact-us.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="main">
    <main>
        <div class="container justify-content-center mt-5 col-md-4">
            <div class="card rounded-4">
                <div class="bg-danger text-light rounded-2 icon mb-3 ms-3 mt-4 pt-1 ">
                    <i class="fa-solid fa-check d-flex justify-content-center mt-1 fs-5"></i>
                </div>
                <h3 class="ms-3 fw-bold text-light ">Welcome back</h3>
                <p class="ms-3 small text-light text-opacity-75">Sign in to continue to your account</p>
                <div class="mb-2 ms-3 me-3">
                    <label for="exampleFormControlInput1" class="form-label text-light text-opacity-75">Email address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-body bg-opacity-10 border-0"><i class="fa-solid fa-envelope text-light text-opacity-25"></i></span>
                        <input type="email" class="form-control bg-body bg-opacity-10 border-0" id="exampleFormControlInput1"
                        placeholder="you@example.com">
                    </div>
                </div>
                <div class="mb-3 ms-3 me-3 ">
                    <a href="#" class="mt-0 d-flex justify-content-end text-danger text-opacity-75 text-decoration-none">Forgot password?</a>
                    <label for="exampleFormControlInput2" class="form-label text-light text-opacity-75">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body bg-opacity-10 border-0"><i class="fa-solid fa-lock text-light text-opacity-25"></i></span>
                            <input type="password" class="form-control bg-body bg-opacity-10 border-0" id="exampleFormControlInput2"
                            placeholder=" Enter your password">
                        </div>
                    </div>
                <button class="btn btn-primary ms-3 me-3 bg-danger p-2 border-0 button" type="submit">Sign in</button>
                <div class="d-flex justify-content-between ms-3 me-3">
                    <p class="text-light text-opacity-75 mt-2">Don't have an account?</p><a href="#" class="text-danger text-opacity-75 mt-2">Creat one</a>
                </div>
                <div class="card-body">
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
